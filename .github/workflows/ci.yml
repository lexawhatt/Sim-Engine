name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.90 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.90.0
      - run: cargo check --all-targets --no-default-features
      - run: cargo check --all-targets --all-features

  quality:
    name: format and core/all-feature lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --no-default-features
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings

  linux-all-targets:
    name: Linux all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
      - run: cargo test --all-targets --all-features

  release-package:
    name: Rustdoc and publishable package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
      - run: cargo test --doc --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
      - name: Verify package boundary and archive
        run: |
          if cargo package --offline --list \
              | grep -Eq '^(\.workbench/|\.idea/|\.github/|target/)'; then
            echo "private or generated files leaked into the package" >&2
            exit 1
          fi
          cargo package --offline

  linux-gpu-contract:
    name: Linux strict Vulkan contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
      - name: Install Mesa software GPU
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Run semantic shader/readback fixture
        env:
          SIM_ENGINE_REQUIRE_GPU_TESTS: "1"
          SIM_ENGINE_REQUIRE_VULKAN: "1"
          WGPU_BACKEND: vulkan
        run: >-
          cargo test --all-features
          renderer::tests::offscreen_gpu_readback_verifies_camera_depth_and_clip_contract
          -- --nocapture
