[package]
name = "sim-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "A validated high-performance visualization engine for simulations"
repository = "https://github.com/lexawhatt/Sim-Engine"
documentation = "https://docs.rs/sim-engine"
readme = "README.md"
keywords = ["graphics", "visualization", "simulation", "wgpu", "2d"]
categories = ["graphics", "rendering", "science"]
include = [
    "/src/**",
    "/examples/**",
    "/scripts/linux_release_gate.sh",
    "/scripts/rendering_benchmark_matrix.sh",
    "/scripts/hidpi_transition_gate.sh",
    "/scripts/hidpi_transition_controller.sh",
    "/Cargo.toml",
    "/README.md",
    "/DOCUMENTATION.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "sim_engine"
path = "src/lib.rs"

[features]
default = ["wgpu"]
wgpu = ["dep:bytemuck", "dep:wgpu"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
wgpu = { version = "30.0.1", optional = true }

[dev-dependencies]
env_logger = "0.11.11"
pollster = "1.0.1"
winit = "0.30.12"

[profile.dev]
opt-level = 1

[[example]]
name = "demo"
required-features = ["wgpu"]

[[example]]
name = "ui_demo"
required-features = ["wgpu"]

[[example]]
name = "particle_cpu_benchmark"

[[example]]
name = "scene_construction_benchmark"

[[example]]
name = "rendering_benchmark_suite"
required-features = ["wgpu"]

[[example]]
name = "stroke_gallery"
required-features = ["wgpu"]

[[example]]
name = "star_remnant_stress"
required-features = ["wgpu"]

[[example]]
name = "stereometry_3d"
required-features = ["wgpu"]

[[example]]
name = "cylinder_derivation_3d"
required-features = ["wgpu"]
